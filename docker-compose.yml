version: '3.8'

services:
  # Service MongoDB
  mongodb:
    image: mongo:7.0
    container_name: ehei_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ehei_chat
    networks:
      - ehei_network
    restart: unless-stopped

  # Service Backend (Spring Boot)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ehei_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/ehei_chat
      - WHATSAPP_API_URL=https://graph.facebook.com/v18.0
      - WHATSAPP_API_TOKEN=${WHATSAPP_API_TOKEN:-VOTRE_TOKEN}
      - WHATSAPP_API_PHONE_NUMBER_ID=${WHATSAPP_API_PHONE_NUMBER_ID:-VOTRE_PHONE_ID}
    depends_on:
      - mongodb
    networks:
      - ehei_network
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - /app/target

  # Service Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ehei_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ehei_network
    restart: unless-stopped

# Réseau pour la communication entre les services
networks:
  ehei_network:
    driver: bridge

# Volumes pour persister les données
volumes:
  mongodb_data:

