# Configuration du serveur
server.port=8080

# Configuration MongoDB
# MongoDB sera accessible via Docker Compose sur le port 27017
spring.data.mongodb.uri=mongodb://mongodb:27017/ehei_chat
spring.data.mongodb.database=ehei_chat

# Configuration CORS (pour permettre React d'accéder à l'API)
# En production, remplacer * par le domaine exact
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Configuration WhatsApp Cloud API
# ⚠️ À remplacer par vos vraies clés d'API Meta
whatsapp.api.url=https://graph.facebook.com/v18.0
whatsapp.api.token=VOTRE_TOKEN_ACCESS
whatsapp.api.phone-number-id=VOTRE_PHONE_NUMBER_ID

# Configuration de sécurité (basique pour le développement)
# En production, utiliser JWT ou OAuth2
spring.security.user.name=admin
spring.security.user.password=admin

# Logging
logging.level.com.ehei=DEBUG
logging.level.org.springframework.web=INFO

